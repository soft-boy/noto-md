<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>noto-md</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2337352f'/><text x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'>N</text></svg>">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <aside id="sidebar">
    <div class="ws">
      <div class="ws-icon" id="ws-icon">N</div>
      <div class="ws-name" id="ws-name"></div>
      <button class="icon-btn" id="collapse" title="Close sidebar (⌘\)">«</button>
    </div>
    <div class="side-actions">
      <button class="side-btn" id="search-btn">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Search</span><kbd>⌘K</kbd>
      </button>
    </div>
    <div class="side-label">
      <span>Pages</span>
      <button class="icon-btn side-new" id="new-file" title="New file" aria-label="New file"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M7.5 14H3.5a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5h5l3 3v3.5M8.5 2v3h3" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/><path d="M12 10v5M9.5 12.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button class="icon-btn side-new" id="new-folder" title="New folder" aria-label="New folder"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M7.5 13h-4A1.5 1.5 0 0 1 2 11.5v-7A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v2" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linejoin="round"/><path d="M12 10v5M9.5 12.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
    <nav id="tree"></nav>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="expand" title="Open sidebar (⌘\)">☰</button>
      <div id="crumbs"></div>
      <div class="spacer"></div>
      <div id="topbar-actions">
        <span id="status"></span>
        <button class="top-btn" id="mode-toggle">Markdown</button>
      </div>
    </header>
    <div id="banner" hidden></div>
    <div id="scroller">
      <article id="page" hidden>
        <h1 id="title" contenteditable="plaintext-only" spellcheck="false" data-placeholder="Untitled"></h1>
        <div id="editor"></div>
        <textarea id="source" spellcheck="false" hidden></textarea>
        <div id="page-end"></div>
      </article>
      <div id="empty" hidden>
        <p id="empty-text"></p>
        <button class="top-btn" id="empty-new">Create a page</button>
      </div>
    </div>
  </main>

  <div id="search" class="modal" hidden>
    <div class="modal-box">
      <input id="search-input" placeholder="Search pages and content…" autocomplete="off" spellcheck="false">
      <div id="search-results"></div>
      <div class="modal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
